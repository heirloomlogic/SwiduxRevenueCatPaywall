name: Lint

# PR-only. See test.yml: the `push: [main]` trigger re-linted a commit the PR had
# already linted. The `main` ruleset requires `swift-format-lint`, so a direct push
# outside a PR is rejected rather than left unlinted. Do not restore this trigger.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin the toolchain so runner-image rotations can't flip CI without a repo change.
  DEVELOPER_DIR: /Applications/Xcode_26.5.app

jobs:
  # Stays on macOS rather than moving to a cheaper Linux runner: the lint step shells
  # out to `xcrun`, which reaches for the macOS toolchain, and this repo is public —
  # Actions minutes are free here, so there is no cost argument to weigh against the
  # rewrite. Revisit only if this package ever goes private.
  swift-format-lint:
    runs-on: macos-26
    # ~8x the observed max (1m11s), sized for a slow `swift package resolve` rather
    # than the lint itself. The GitHub default is six hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job resolves SwiftPM dependencies and runs the Persnoop build-tool
          # plugin after checkout. Persisted credentials would put the GITHUB_TOKEN
          # inside their blast radius. Nothing here pushes.
          persist-credentials: false

      - name: Cache SwiftPM build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-lint-${{ env.DEVELOPER_DIR }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-lint-${{ env.DEVELOPER_DIR }}-

      - name: Setup swift-format lint
        run: |
          touch .dev-tooling
          swift package resolve
          .build/checkouts/Persnicket/bin/ci-lint-setup

      - name: Lint (strict)
        run: xcrun swift-format lint --strict --parallel --recursive --configuration .swift-format Sources Tests
